# docker compose up -d --build     -> portal en http://localhost:8080
# docker compose run --rm sofibot sofibot check      (y el resto de comandos `sofibot`)
services:
  sofibot:
    build: .
    image: datasofi/sofibot-eqz:0.1.0
    container_name: sofibot-eqz
    env_file: .env
    # En Linux, carpetas montadas propiedad de otro usuario: SOFIBOT_UID/SOFIBOT_GID en .env.
    user: "${SOFIBOT_UID:-10001}:${SOFIBOT_GID:-10001}"
    ports:
      - "${SOFIBOT_BIND:-127.0.0.1}:${SOFIBOT_PORT:-8080}:8080"
    volumes:
      - ./reports:/app/reports
      - ./output:/app/output
    extra_hosts:
      # Permite usar SQLSERVER_HOST=host.docker.internal para un SQL Server instalado en el propio equipo.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
