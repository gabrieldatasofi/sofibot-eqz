[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sofibot-eqz"
version = "0.2.1"
description = "Informes HTML y Excel desde las tablas Gold de SQL Server"
requires-python = ">=3.12"
# Rangos compatibles. Las versiones exactas que se instalan (también las indirectas)
# están en requirements.txt; mantenlos de acuerdo al actualizar.
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.31,<1",
    "python-dotenv>=1,<2",
    "pyodbc>=5.2,<6",
    "xlsxwriter>=3.2,<4",
    "pandas>=2.2,<3",
    "msal>=1.31,<2",           # inicio de sesión con Microsoft Entra ID
    "itsdangerous>=2.2,<3",    # cookie de sesión firmada
    "requests>=2.32,<3",       # el portal reenvía consultas al servicio de consultas
    "markdown>=3.7,<4",        # documentación técnica en la página de administración
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx2>=2.16,<3"]  # versiones exactas en requirements-dev.txt

[project.scripts]
sofibot = "sofibot_eqz.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sofibot_eqz = ["assets/**/*", "template/*", "report_guide.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
