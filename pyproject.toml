[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sofibot-eqz"
version = "0.1.0"
description = "Informes HTML y Excel desde las tablas Gold de SQL Server"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.31,<1",
    "python-dotenv>=1,<2",
    "pyodbc>=5.2,<6",
    "xlsxwriter>=3.2,<4",
    "pandas>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sofibot = "sofibot_eqz.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sofibot_eqz = ["assets/**/*", "template/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
